# SonarCloud : https://sonarcloud.io (organisation et clé affichées dans Administration > Informations)
sonar.organization=erreur32
sonar.projectKey=Erreur32_MyServices
sonar.projectName=MyServices

# Code analysé : tout le dépôt (back Python, connecteurs, front TypeScript, page statique, scripts de l'agent) ;
# les tests en sont retirés des sources : un fichier ne peut pas être à la fois source et test (« indexed twice »)
sonar.sources=.
sonar.tests=tests,front/src
sonar.test.inclusions=tests/**,front/src/**/*.test.ts,front/src/**/*.test.tsx
sonar.exclusions=tests/**,front/src/**/*.test.ts,front/src/**/*.test.tsx,front/node_modules/**,front/dist/**,dev-data/**,web/data.json,web/events.json,web/health/**,deploy/**,requirements.txt,package-lock.json,**/__pycache__/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
