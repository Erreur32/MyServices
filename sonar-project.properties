# SonarCloud : https://sonarcloud.io (organisation et clé affichées dans Administration > Informations)
sonar.organization=erreur32
sonar.projectKey=Erreur32_MyServices
sonar.projectName=MyServices

# Code analysé : back Python à la racine + connecteurs, front TypeScript, page statique
sonar.sources=.,front/src,web
sonar.tests=tests,front/src
sonar.test.inclusions=tests/**,front/src/**/*.test.ts,front/src/**/*.test.tsx
sonar.exclusions=front/node_modules/**,front/dist/**,dev-data/**,web/data.json,web/events.json,web/health/**,deploy/**,requirements.txt,package-lock.json,**/__pycache__/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
