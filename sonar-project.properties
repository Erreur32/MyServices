# SonarCloud : https://sonarcloud.io (organisation et clé affichées dans Administration > Informations)
sonar.organization=erreur32
sonar.projectKey=Erreur32_MyServices
sonar.projectName=MyServices

# Code analysé : tout le dépôt (back Python, connecteurs, front TypeScript, page statique, scripts de l'agent) ;
# les tests en sont retirés des sources : un fichier ne peut pas être à la fois source et test (« indexed twice »)
sonar.sources=.
sonar.tests=tests,front/src
sonar.test.inclusions=tests/**,front/src/**/*.test.ts,front/src/**/*.test.tsx
sonar.exclusions=tests/**,front/src/**/*.test.ts,front/src/**/*.test.tsx,front/node_modules/**,front/dist/**,dev-data/**,web/data.json,web/events.json,web/health/**,deploy/**,requirements.txt,package-lock.json,**/__pycache__/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Couverture des tests (produite par le workflow avant l'analyse)
# Hors du calcul de couverture : l'agent Windows (PowerShell) et l'ancienne page statique (web/), sans lanceur de tests ; les écrans
# React (tabs/, components/, App, main, theme) : pas de tests unitaires d'écran, choix assumé. La logique du front reste mesurée
# (front/src/lib, api.ts) comme le Python : une logique qui grossit dans un écran est sortie dans lib/ avec son test.
sonar.coverage.exclusions=agent/**,web/**,front/vite.config.ts,front/src/tabs/**,front/src/components/**,front/src/App.tsx,front/src/main.tsx,front/src/theme.ts
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=front/coverage/lcov.info

# Accepted on purpose: the apps of a home network (Ollama, Bazarr, Backrest, Home Assistant…) mostly answer in plain http on the LAN,
# so the connectors and the install tools propose http://<ip>:<port> by default (python:S5332, cleartext protocol). Limited to them;
# https is used as soon as the app offers it, and anywhere else the rule still applies.
sonar.issue.ignore.multicriteria=lanhttp1,lanhttp2,lanhttp3,lanhttp4
sonar.issue.ignore.multicriteria.lanhttp1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.lanhttp1.resourceKey=connectors/**/*.py
sonar.issue.ignore.multicriteria.lanhttp2.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.lanhttp2.resourceKey=known_apps.py
sonar.issue.ignore.multicriteria.lanhttp3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.lanhttp3.resourceKey=setup.py
sonar.issue.ignore.multicriteria.lanhttp4.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.lanhttp4.resourceKey=import_install.py
