# MyServices: example docker compose, ready to use. Still in a test phase: do not rely on it for production.
#
#   mkdir -p /opt/myservices && cd /opt/myservices
#   curl -fsSLo docker-compose.yaml https://raw.githubusercontent.com/Erreur32/MyServices/main/deploy/compose.example.yaml
#   curl -fsSLo .env https://raw.githubusercontent.com/Erreur32/MyServices/main/deploy/env.example   # optional: change the port
#   docker compose up -d
#   docker compose logs myservices   # the app's public SSH key, and the command to allow it on the host
#
# Then, within 30 minutes, open http://<host IP>:8090/ and create the admin account (later: docker compose restart myservices).
# Everything else is set in the page (Settings).
#
# Port: 8090 by default. The container uses the host network, so a "ports:" mapping would do nothing: set MYSERVICES_PORT
# instead, in a ".env" file next to this one (echo 'MYSERVICES_PORT=8095' > .env). Check first that it is free: ss -ltnp | grep 8095
#
# Rights: the app always runs as the account 10001, never root. The container starts as root only to give ./config and ./data
# to that account (folders created by Docker belong to root otherwise), then drops to it, keeping NET_RAW alone so that ping
# works on every host (without it, hosts where unprivileged ping is off would show 0 device in the network search).
# One container only: no "init" service. Coming from a compose that had one: docker compose up -d --remove-orphans.
#
# No Docker socket: the host machine is read over SSH like the others (alias "hote", created at startup).

services:
  myservices:
    image: ghcr.io/erreur32/myservices:latest   # latest release; pin one with :0.10.6, or :main for the latest commit
    container_name: myservices
    restart: unless-stopped
    user: "0:0"                # start only: rights of ./config and ./data, then the app runs as 10001
    network_mode: host         # ping and network search on the LAN, SSH to the machines, page on MYSERVICES_PORT
    environment:
      TZ: Europe/Paris
      MYSERVICES_PORT: "${MYSERVICES_PORT:-8090}"
      # Networks allowed to open the page (default: private networks and loopback)
      # MYSERVICES_ALLOW: "192.168.1.0/24,127.0.0.0/8"
      # SSH account of the "hote" alias (the host machine); a dedicated non-root account is safer (README)
      # MYSERVICES_HOST_USER: "root"
      # Behind an HTTPS proxy (NPM, Caddy...): session cookies marked Secure
      # MYSERVICES_COOKIE_SECURE: "1"
      # Task schedules, "minutes hours" (defaults: collect "10,40 *", watch "15,45 *", health "0 0,6,12,18", backups "5 7,19").
      # Set here, they can no longer be changed in the page (Settings -> Tasks and schedules).
      # MYSERVICES_COLLECT_AT: "10,40 *"
      # Automatic network search, every N hours (default 6, 0 = off)
      # MYSERVICES_NETSCAN_EVERY: "6"
    volumes:
      - ./config:/config   # config.json, services-meta.json, secret.key, ssh/ (the app's key, aliases, known_hosts)
      - ./data:/data       # produced page, caches, state, myservices.db (accounts, history, alerts)
    # Hardening: read-only file system, no privilege escalation, only the capabilities needed at start
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_RAW]   # the start uses them; the app keeps NET_RAW only (ping)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
