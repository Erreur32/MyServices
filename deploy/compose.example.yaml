# MyServices v2 : exemple de docker compose, prêt à l'emploi.
#
#   mkdir -p /opt/myservices && cd /opt/myservices
#   curl -fsSLo docker-compose.yaml https://raw.githubusercontent.com/Erreur32/MyServices/main/deploy/compose.example.yaml
#   curl -fsSLo .env https://raw.githubusercontent.com/Erreur32/MyServices/main/deploy/env.example     # optional: to change the port (MYSERVICES_PORT)
#   docker compose up -d
#   docker compose logs myservices      # clé publique de l'app + commande pour l'autoriser sur l'hôte
#
# Puis, dans les 30 minutes : ouvrir http://<IP de l'hôte>:8090/ (ou le port choisi, voir PORT ci-dessous ; la racine mène à la page de connexion puis à l'application) et créer le compte admin
# (passé ce délai : docker compose restart myservices). Le reste se règle dans la page (Réglages).
#
# PORT: the app listens on 8090 by default. To change it (port already taken on the host), set MYSERVICES_PORT, in a ".env" file next to
# this one (see deploy/env.example) or in the shell: `echo 'MYSERVICES_PORT=8095' > .env && docker compose up -d`, then open
# http://<host IP>:8095/ . The container uses the host network, so a `ports:` mapping would be ignored: this variable is the only thing to change.
# Check first that the port is free: ss -ltnp | grep 8095
#
# Droits : l'app tourne sous le compte 10001 (jamais root). Le conteneur démarre en root le temps de donner ./config et
# ./data à ce compte (dossiers créés par Docker = root sinon, et l'app ne pourrait rien y écrire), puis passe sur 10001.
# Ancien compose avec un service « init » (busybox) : le retirer, puis docker compose up -d --remove-orphans.
# Pas de socket Docker : la machine hôte est lue par SSH comme les autres (alias « hote », créé au démarrage).
# Importer une installation classique (systemd) : voir import_install.py dans le README.

services:
  myservices:
    image: ghcr.io/erreur32/myservices:latest     # latest = last release (shows its version, e.g. v0.10.2) ; pin one with :0.10.2 ; :main = latest commit of the main branch (shows « v0.10.2+ · main · abc1234 »)
    container_name: myservices
    restart: unless-stopped
    # Démarre en root seulement pour régler les droits de ./config et ./data, puis passe sur le compte 10001 (entrypoint de l'image)
    user: "0:0"
    # Réseau de l'hôte : ping et recherche sur le LAN, SSH vers les machines, page sur MYSERVICES_PORT
    network_mode: host
    environment:
      TZ: Europe/Paris
      # >>> PORT: the app listens here. Port 8090 already taken on the host? Change the 8090 below (or set MYSERVICES_PORT in a .env file).
      MYSERVICES_PORT: "${MYSERVICES_PORT:-8090}"
      # Réseaux autorisés à ouvrir la page (défaut : réseaux privés et boucle locale)
      # MYSERVICES_ALLOW: "192.168.1.0/24,127.0.0.0/8"
      # Compte SSH de l'alias « hote » (machine hôte) ; un compte dédié non root est plus sûr (README)
      # MYSERVICES_HOST_USER: "root"
      # Derrière un proxy HTTPS (NPM, Caddy…) : cookies de session marqués Secure
      # MYSERVICES_COOKIE_SECURE: "1"
      # Horaires des tâches, « minutes heures » (défauts : collecte 10,40 *, veille 15,45 *, santé 0 0,6,12,18)
      # MYSERVICES_COLLECT_AT: "10,40 *"
    volumes:
      - ./config:/config   # config.json, services-meta.json, secret.key, ssh/ (clé de l'app, alias, known_hosts)
      - ./data:/data       # page produite, caches, état, myservices.db (comptes, historique, alertes)
    # Durcissement : système de fichiers en lecture seule, aucun droit noyau, pas d'élévation
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # Seulement pour le démarrage (droits des dossiers, puis passage sur 10001) ; l'app, elle, n'en garde aucun
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
